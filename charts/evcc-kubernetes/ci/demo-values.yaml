# Demo setup with simulated meters and a simulated charger, rendered as
# /etc/evcc.yaml. CI installs the chart with it to test the YAML config path;
# it also serves as an example for configuring evcc via values instead of
# the web interface. Install with: --values ci/demo-values.yaml

# Demo data does not need to survive a restart.
persistence:
  enabled: false

evcc:
  network:
    schema: http
    host: evcc.local  # .local suffix announces the hostname on MDNS
    port: 7070

  log: debug
  levels:
    cache: error

#   # unique installation id
#   plant: 35833f444c5afd666dcbcc96e554de698e5bf97b04e3ecbc7fe403ee9093b676

  # interval: 30s # control cycle interval

#   mqtt:
#     broker: mosquitto.local
#     topic: evcc

  meters:
    - name: my_grid
      type: template
      template: demo-meter
      usage: grid
      power: -4000
    - name: my_pv
      type: template
      template: demo-meter
      usage: pv
      power: 10000
    - name: my_charger
      type: template
      template: demo-meter
      usage: charge
      power: 1000

  chargers:
    - name: my_charger
      type: template
      template: demo-charger
      status: A  # [A, B, C]
      power: 3680  # optional
      enabled: true  # optional
      maxcurrent: 16  # Definiert die maximale Stromstärke pro angeschlossener Phase mit welcher das Fahrzeug geladen werden soll (optional)
      phases1p3p: false  # optional

#   vehicles:
#   - type: template
#     template: offline
#     title: e-Golf
#     capacity: 86
#     name: egolf
#     icon: car

  loadpoints:
  - title: Carport
    charger: my_charger
    mode: pv

  site:
    title: Mein Zuhause
    meters:
      grid: my_grid
      pv:
      - my_pv
