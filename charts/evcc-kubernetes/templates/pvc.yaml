{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "evcc-kubernetes.fullname" . }}-data
  labels:
    {{- include "evcc-kubernetes.labels" . | nindent 4 }}
  annotations:
    # Keep charging sessions and settings on helm uninstall; a reinstall with
    # the same release name picks the PVC up again.
    helm.sh/resource-policy: keep
spec:
  resources:
    requests:
      storage: {{ .Values.persistence.capacity }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}  
  {{- end -}}
{{- end -}}