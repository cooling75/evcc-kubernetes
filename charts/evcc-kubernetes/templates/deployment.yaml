apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evcc-kubernetes.fullname" . }}
  labels:
    {{- include "evcc-kubernetes.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- /*
    evcc must never run twice (it controls the chargers, and its database is on a
    ReadWriteOnce volume), so the old pod is stopped before the new one starts.
    Recreate would do the same, but switching an existing RollingUpdate deployment
    to it fails with server-side apply (Helm 4) because of the defaulted
    rollingUpdate block.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "evcc-kubernetes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.evcc .Values.podAnnotations }}
      annotations:
        {{- if .Values.evcc }}
        {{- /* Restart the pod when the evcc config changes; subPath mounts are never updated. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "evcc-kubernetes.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "evcc-kubernetes.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.web.port }}
              protocol: TCP
            - name: ocpp
              containerPort: {{ .Values.service.ocpp.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.evcc .Values.persistence.enabled .Values.volumeMounts }}
          volumeMounts:
          {{- if .Values.evcc }}
            - name: config
              mountPath: /etc/evcc.yaml
              subPath: evcc.yaml
          {{- end }}
          {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /root/.evcc/
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- if or .Values.evcc .Values.persistence.enabled .Values.volumes }}
      volumes:
        {{- if .Values.evcc }}
        - name: config
          configMap:
            name: {{ include "evcc-kubernetes.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            {{- if .Values.persistence.existingClaim }}
            claimName: {{ .Values.persistence.existingClaim -}}
            {{- else }}
            claimName: {{ include "evcc-kubernetes.fullname" . }}-data
            {{- end -}}
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
