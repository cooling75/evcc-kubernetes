# Gateway API HTTPRoute

apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: gatewayroute
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  rules:
    - matches:
        - path:
            type: Prefix
            value: /example
      forwardTo:
        - targetRef:
            name: my-service
            port: 80
