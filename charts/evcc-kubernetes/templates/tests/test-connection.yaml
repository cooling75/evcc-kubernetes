apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "evcc-kubernetes.fullname" . }}-test-connection"
  labels:
    {{- include "evcc-kubernetes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['-q', '--spider', 'http://{{ include "evcc-kubernetes.fullname" . }}-web:{{ .Values.service.web.port }}']
  restartPolicy: Never
