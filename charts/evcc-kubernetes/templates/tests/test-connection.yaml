apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "evcc-kubernetes.fullname" . }}-test-connection"
  labels:
    {{- include "evcc-kubernetes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      # A freshly ready pod can take a moment to show up behind the service
      # (until then the connection is refused), so retry for up to a minute.
      command: ['sh', '-c']
      args:
        - |
          url='http://{{ include "evcc-kubernetes.fullname" . }}-web:{{ .Values.service.web.port }}'
          for i in $(seq 1 30); do
            wget -q --spider "$url" && exit 0
            sleep 2
          done
          echo "no response from $url"
          exit 1
  restartPolicy: Never
