# Default values for evcc-kubernetes.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: evcc/evcc
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Set the services for the web interface and ocpp
service:
  web:
    type: ClusterIP
    port: 80
    targetPort: 7070
  ocpp:
    type: LoadBalancer
    port: 8887
    targetPort: 8887

gatewayApi:
  enabled: false
  gatewayName: cluster-gateway
  gatewayNamespace: kube-system
  hostnames:
    - "evcc.local"
  # Create a ReferenceGrant to allow the Gateway to reference the Secret in another namespace (if needed)
  createReferenceGrant: false

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  # className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: evcc.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: evcc-tls-secret
    #   hosts:
    #     - evcc.local

# Persists /root/.evcc: the evcc database with charging sessions and everything
# set up in the web interface. Without it, all of this is lost on every pod
# restart. The PVC is kept on `helm uninstall` (helm.sh/resource-policy: keep).
persistence:
  enabled: true
  capacity: 500Mi
  # Use an existing PVC for persistence
  # existingClaim: evcc-data
  # Use a specific storageClass for the PVC instead of the cluster default.
  # evcc keeps its data in SQLite, which does not work reliably on NFS.
  # storageClass: local-path

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: 7070
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: 7070
  initialDelaySeconds: 10
  periodSeconds: 10

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# evcc configuration, rendered as /etc/evcc.yaml exactly as given here.
# Empty by default: evcc then starts without a config file and is set up via its
# web interface, as recommended by the evcc docs. Everything set up there is
# stored in the database under /root/.evcc (see persistence).
# https://docs.evcc.io/en/installation/configuration
# A complete example with simulated devices is in ci/demo-values.yaml.
evcc: {}
#   network:
#     host: evcc.local
#   mqtt:
#     broker: mosquitto.local
#     topic: evcc
