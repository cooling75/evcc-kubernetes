# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
          check-latest: true
      - name: Helm Chart Testing
        # You may pin to the exact commit or the version.
        # uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f
        uses: helm/chart-testing-action@v2.9.0
      # A pull request that changes the chart is linted against the default
      # branch, which also enforces a chart version bump. Everything else
      # (pushes to main, workflow-only PRs, manual runs) lints the whole
      # chart; --all skips the version check, which has nothing to compare
      # against there.
      - name: Run chart-testing (lint)
        run: |
          target=${{ github.event.repository.default_branch }}
          if [[ "${{ github.event_name }}" == "pull_request" && -n "$(ct list-changed --target-branch "$target")" ]]; then
            ct lint --target-branch "$target"
          else
            ct lint --all
          fi

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2

      # Always install the (single) chart and run its helm test, so that
      # workflow-only PRs such as Renovate action updates are exercised too.
      - name: Run chart-testing (install)
        run: ct install --all
